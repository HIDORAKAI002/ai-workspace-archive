name: Build Mega Website
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install MkDocs
        run: pip install mkdocs-material
      - name: Extract Documentation
        run: python scripts/build_mega_site.py
      - name: Free up disk space
        run: |
          echo "Moving docs to safety..."
          mv docs /tmp/docs
          mv mkdocs.yml /tmp/mkdocs.yml
          echo "Deleting the massive 11GB source code to free space..."
          rm -rf *
          echo "Deleting hidden folders like .git to free up another 10GB..."
          rm -rf .git
          rm -rf .github
          echo "Restoring docs..."
          mv /tmp/docs docs
          mv /tmp/mkdocs.yml mkdocs.yml
      - name: Build site
        run: mkdocs build --verbose
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4