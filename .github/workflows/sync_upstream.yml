name: 🔄 Daily Sync — Lightweight Repos

on:
  schedule:
    # Every day at 02:00 UTC (7:30 AM IST) — lightweight repos only
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: false
        default: 'light'
        type: choice
        options: [light, heavy, all]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout archive repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔄 Run sync script
        run: |
          MODE="${{ github.event.inputs.mode || 'light' }}"
          echo "Running sync in [$MODE] mode..."
          python scripts/sync_repos.py --mode $MODE

      - name: 📦 Commit and push if changes exist
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "✨ No changes detected. Everything is already up to date."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            MODE="${{ github.event.inputs.mode || 'light' }}"
            git commit -m "chore(sync): Auto-sync [$MODE repos] [$TIMESTAMP]"
            git push origin main
            echo "✅ Changes pushed successfully!"
          fi
