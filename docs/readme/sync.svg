<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Sync loop">
  <rect width="1200" height="240" fill="#05060a"/>
  <text x="40" y="48" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">IT PULLS ITSELF. EVERY 6 HOURS.</text>
  <rect x="36" y="86" width="320" height="112" rx="22" fill="#0b1220" stroke="#67e8f9" stroke-width="3"/>
  <text x="196" y="136" text-anchor="middle" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">UPSTREAM</text>
  <text x="196" y="166" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="16">55+ public repos</text>
  <rect x="440" y="86" width="320" height="112" rx="22" fill="#0b1220" stroke="#e879f9" stroke-width="3"/>
  <text x="600" y="136" text-anchor="middle" fill="#e879f9" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">6 HOUR LOOP</text>
  <text x="600" y="166" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="16">VPS bot + daily Actions</text>
  <rect x="844" y="86" width="320" height="112" rx="22" fill="#0b1220" stroke="#fbbf24" stroke-width="3"/>
  <text x="1004" y="136" text-anchor="middle" fill="#fbbf24" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">THIS ARCHIVE</text>
  <text x="1004" y="166" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="16">.git stripped, files kept</text>
  <circle r="8" fill="#f8fafc"><animate attributeName="cx" values="356;430" dur="0.9s" repeatCount="indefinite"/><animate attributeName="cy" values="142;142" dur="0.9s" repeatCount="indefinite"/></circle>
  <circle r="8" fill="#f8fafc"><animate attributeName="cx" values="760;834" dur="0.9s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="cy" values="142;142" dur="0.9s" repeatCount="indefinite"/></circle>
</svg>
