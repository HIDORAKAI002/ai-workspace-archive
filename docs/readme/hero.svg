<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="AI Workspace Archive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080d"/>
      <stop offset="1" stop-color="#121624"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#334155">
    <path d="M0 60H1200M0 140H1200M0 220H1200M0 300H1200M0 380H1200"/>
    <path d="M100 0V480M250 0V480M400 0V480M550 0V480M700 0V480M850 0V480M1000 0V480M1150 0V480"/>
  </g>
  <rect x="24" y="20" width="1152" height="440" rx="26" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="36 16">
    <animate attributeName="stroke-dashoffset" values="0;-104" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="40" width="1200" height="8" fill="#67e8f9" opacity="0">
    <animate attributeName="y" values="36;420;36" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.28;0" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <g filter="url(#glow)" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g>
      <text x="600" y="168" fill="#f8fafc" font-size="62" font-weight="700">AI WORKSPACE</text>
      <animate attributeName="opacity" values="1;1;0.45;1" keyTimes="0;0.46;0.5;0.56" dur="3.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="600" y="258" fill="#67e8f9" font-size="78" font-weight="700">ARCHIVE</text>
      <animate attributeName="opacity" values="1;0.3;1;1" keyTimes="0;0.07;0.14;1" dur="2.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <rect x="390" y="278" width="420" height="4" rx="2" fill="url(#neon)">
    <animate attributeName="width" values="80;420;80" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="560;390;560" dur="3.6s" repeatCount="indefinite"/>
  </rect>
