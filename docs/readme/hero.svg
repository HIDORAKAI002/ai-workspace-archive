<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="AI Workspace Archive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="1" stop-color="#14081c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#e879f9;#fbbf24;#22d3ee" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#e879f9"><animate attributeName="stop-color" values="#e879f9;#fbbf24;#22d3ee;#e879f9" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="42%">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <ellipse cx="600" cy="210" rx="420" ry="150" fill="url(#halo)">
    <animate attributeName="rx" values="300;460;300" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="#67e8f9">
    <circle cx="80" cy="90" r="2"><animate attributeName="cy" values="480;20" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="140" r="2" fill="#e879f9"><animate attributeName="cy" values="500;10" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="60" r="1.5" fill="#fbbf24"><animate attributeName="cy" values="500;0" dur="6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="200" r="2" fill="#34d399"><animate attributeName="cy" values="510;20" dur="8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="80" r="2" fill="#fb7185"><animate attributeName="cy" values="490;10" dur="7.5s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="160" r="1.5"><animate attributeName="cy" values="500;30" dur="10s" begin="2s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="18" y="16" width="1164" height="488" rx="28" fill="none" stroke="url(#neon)" stroke-width="3" stroke-dasharray="18 10">
    <animate attributeName="stroke-dashoffset" values="0;-280" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 205" to="360 600 205" dur="10s" repeatCount="indefinite"/>
    <ellipse cx="600" cy="205" rx="400" ry="86" fill="none" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle cx="1000" cy="205" r="6" fill="#67e8f9"/>
    <circle cx="200" cy="205" r="5" fill="#e879f9"/>
    <circle cx="600" cy="119" r="5" fill="#fbbf24"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 600 205" to="0 600 205" dur="7s" repeatCount="indefinite"/>
    <ellipse cx="600" cy="205" rx="330" ry="64" fill="none" stroke="#e879f9" stroke-opacity="0.45" stroke-dasharray="2 8"/>
    <circle cx="930" cy="205" r="4" fill="#fb7185"/>
    <circle cx="270" cy="205" r="4" fill="#a3e635"/>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-width="2">
    <ellipse cx="600" cy="210" rx="60" ry="22" opacity="0">
      <animate attributeName="rx" values="50;240" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="18;78" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="210" rx="60" ry="22" opacity="0">
      <animate attributeName="rx" values="50;240" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="18;78" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g filter="url(#glow)" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <g opacity="0.85">
      <text x="592" y="176" fill="#22d3ee" font-size="64">AI WORKSPACE</text>
      <text x="608" y="264" fill="#e879f9" font-size="82">ARCHIVE</text>
      <animate attributeName="opacity" values="0;0.9;0;0;0.75;0" dur="1.8s" repeatCount="indefinite"/>
    </g>
    <text x="600" y="176" fill="#f8fafc" font-size="64">AI WORKSPACE</text>
    <text x="600" y="264" fill="#67e8f9" font-size="82">ARCHIVE
      <animate attributeName="fill" values="#67e8f9;#e879f9;#fbbf24;#67e8f9" dur="4.5s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="600" y="312" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">OFFLINE   ·   NO SUBSCRIPTIONS   ·   NO GATEKEEPING</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <g><rect x="48" y="392" width="128" height="48" rx="24" fill="#0b1220" stroke="#67e8f9" stroke-width="2"/><text x="112" y="422" fill="#67e8f9">Skills</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.8s" repeatCount="indefinite"/></g>
    <g><rect x="186" y="392" width="128" height="48" rx="24" fill="#0b1220" stroke="#e879f9" stroke-width="2"/><text x="250" y="422" fill="#e879f9">MCP</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.8s" begin="0.22s" repeatCount="indefinite"/></g>
    <g><rect x="324" y="392" width="128" height="48" rx="24" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/><text x="388" y="422" fill="#fbbf24">Rules</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.8s" begin="0.44s" repeatCount="indefinite"/></g>
    <g><rect x="462" y="392" width="128" height="48" rx="24" fill="#0b1220" stroke="#fb7185" stroke-width="2"/><text x="526" y="422" fill="#fb7185">Prompts</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.8s" begin="0.66s" repeatCount="indefinite"/></g>
    <g><rect x="600" y="392" width="128" height="48" rx="24" fill="#0b1220" stroke="#34d399" stroke-width="2"/><text x="664" y="422" fill="#34d399">APIs</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.8s" begin="0.88s" repeatCount="indefinite"/></g>
    <g><rect x="738" y="392" width="128" height="48" rx="24" fill="#0b1220" stroke="#60a5fa" stroke-width="2"/><text x="802" y="422" fill="#60a5fa">No-code</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.8s" begin="1.1s" repeatCount="indefinite"/></g>
    <g><rect x="876" y="392" width="128" height="48" rx="24" fill="#0b1220" stroke="#f472b6" stroke-width="2"/><text x="940" y="422" fill="#f472b6">Public</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.8s" begin="1.32s" repeatCount="indefinite"/></g>
    <g><rect x="1014" y="392" width="128" height="48" rx="24" fill="#0b1220" stroke="#a3e635" stroke-width="2"/><text x="1078" y="422" fill="#a3e635">Agents</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.8s" begin="1.54s" repeatCount="indefinite"/></g>
  </g>
</svg>
