      <text x="978" y="385" fill="#f472b6">Public</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.8s" begin="1.7999999999999998s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="1058" y="356" width="132" height="46" rx="23" fill="#0b1220" stroke="#a3e635" stroke-width="2"/>
      <text x="1124" y="385" fill="#a3e635">Agents</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.8s" begin="2.1s" repeatCount="indefinite"/>
