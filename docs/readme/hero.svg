      <text x="540" y="385" fill="#fb7185">Prompts</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.8s" begin="0.8999999999999999s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="620" y="356" width="132" height="46" rx="23" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
      <text x="686" y="385" fill="#34d399">APIs</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.8s" begin="1.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="766" y="356" width="132" height="46" rx="23" fill="#0b1220" stroke="#60a5fa" stroke-width="2"/>
      <text x="832" y="385" fill="#60a5fa">No-code</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.8s" begin="1.5s" repeatCount="indefinite"/>
    </g>
    <g>
