      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.8s" begin="0.0s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="182" y="356" width="132" height="46" rx="23" fill="#0b1220" stroke="#e879f9" stroke-width="2"/>
